<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>O-Space 收納資料庫</title>
  
  <!-- 載入 Tailwind CSS (用於快速排版與設計) -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- 載入 Font Awesome 圖示 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- 載入 React 核心庫 -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  
  <!-- 載入 Babel -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- 載入 html2pdf.js 用於產生 PDF 報價單 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>
<body class="bg-[#f7f5f0]">
  
  <div id="root"></div>

  <!-- 使用 ES Modules 載入 Firebase -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
    import { getFirestore, collection, addDoc, deleteDoc, doc, onSnapshot, updateDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    window.firebaseAPI = {
      initializeApp, getAuth, signInAnonymously, onAuthStateChanged,
      getFirestore, collection, addDoc, deleteDoc, doc, onSnapshot, updateDoc
    };

    window.dispatchEvent(new Event('firebase-loaded'));
  </script>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    const defaultBoxes = [
      { name: "無印良品 聚丙烯收納盒 (大)", brand: "MUJI", category: "box", l: 26, w: 37, h: 24, price: 399, url: "https://www.muji.com/tw/", image: "https://images.unsplash.com/photo-1595422652236-419b67b14db8?auto=format&fit=crop&w=300&q=80" },
      { name: "IKEA KUGGIS 附蓋收納盒", brand: "IKEA", category: "box", l: 26, w: 35, h: 15, price: 249, url: "https://www.ikea.com.tw/zh", image: "https://images.unsplash.com/photo-1611269154421-4e27233ac5c7?auto=format&fit=crop&w=300&q=80" },
      { name: "聚丙烯抽屜收納箱/深型", brand: "MUJI", category: "drawer", l: 40, w: 26, h: 17.5, price: 599, url: "", image: "https://images.unsplash.com/photo-1583847268964-b28ce8f31586?auto=format&fit=crop&w=300&q=80" },
      { name: "IKEA LERBERG 層架組", brand: "IKEA", category: "shelf", l: 35, w: 60, h: 148, price: 599, url: "https://www.ikea.com.tw/zh", image: "https://images.unsplash.com/photo-1558997519-83ea9252edf8?auto=format&fit=crop&w=300&q=80" }
    ];

    const WIDTH_RANGES = [
      { id: 'all', label: '不限', min: 0, max: Infinity },
      { id: 'w1', label: '0~15', min: 0, max: 15 },
      { id: 'w2', label: '16~25', min: 16, max: 25 },
      { id: 'w3', label: '26~35', min: 26, max: 35 },
      { id: 'w4', label: '36~45', min: 36, max: 45 },
      { id: 'w5', label: '46~60', min: 46, max: 60 },
      { id: 'w6', label: '60以上', min: 60.01, max: Infinity }
    ];
    
    const DEPTH_RANGES = [
      { id: 'all', label: '不限', min: 0, max: Infinity },
      { id: 'd1', label: '0~20', min: 0, max: 20 },
      { id: 'd2', label: '21~30', min: 21, max: 30 },
      { id: 'd3', label: '31~40', min: 31, max: 40 },
      { id: 'd4', label: '41~50', min: 41, max: 50 },
      { id: 'd5', label: '51~65', min: 51, max: 65 },
      { id: 'd6', label: '65以上', min: 65.01, max: Infinity }
    ];

    const HEIGHT_RANGES = [
      { id: 'all', label: '不限', min: 0, max: Infinity },
      { id: 'h1', label: '0~10', min: 0, max: 10 },
      { id: 'h2', label: '11~20', min: 11, max: 20 },
      { id: 'h3', label: '21~30', min: 21, max: 30 },
      { id: 'h4', label: '31~45', min: 31, max: 45 },
      { id: 'h5', label: '45以上', min: 45.01, max: Infinity }
    ];

    function MainApp() {
      const firebaseConfig = {
        apiKey: "AIzaSyDroMVHoUROFhn0LwclRbb5OpHLGSzsu9A",
        authDomain: "jenny-space.firebaseapp.com",
        projectId: "jenny-space",
        storageBucket: "jenny-space.firebasestorage.app",
        messagingSenderId: "948251254988",
        appId: "1:948251254988:web:6354bacee423d2856f2269"
      };

      const appId = 'ospace-v1';

      const [activeTab, setActiveTab] = useState('search');
      const [sizeSearchMode, setSizeSearchMode] = useState('quick');
      const [boxes, setBoxes] = useState([]);
      const [user, setUser] = useState(null);
      const [isLoading, setIsLoading] = useState(true);
      const [isCloudSyncing, setIsCloudSyncing] = useState(false);
      const [modalMessage, setModalMessage] = useState(null);
      
      const [searchParams, setSearchParams] = useState({ wRange: 'all', lRange: 'all', hRange: 'all', category: 'all', w: '', l: '', h: '' });
      const [newBox, setNewBox] = useState({ name: '', brand: '', category: 'box', l: '', w: '', h: '', iw: '', il: '', ih: '', price: '', url: '', image: '' });
      const [previewImage, setPreviewImage] = useState(null);
      const fileInputRef = useRef(null);

      const [editingBox, setEditingBox] = useState(null);
      const editFileInputRef = useRef(null);

      const [cart, setCart] = useState([]);
      const [quantities, setQuantities] = useState({});
      
      const [isGeneratingPDF, setIsGeneratingPDF] = useState(false);
      const pdfRef = useRef(null);

      const handleQuantityChange = (id, delta) => {
        setQuantities(prev => ({
          ...prev,
          [id]: Math.max(1, (prev[id] || 1) + delta)
        }));
      };

      const addToCart = (box) => {
        const qty = quantities[box.id] || 1;
        setCart(prev => {
          const existing = prev.find(item => item.id === box.id);
          if (existing) {
            return prev.map(item => item.id === box.id ? { ...item, quantity: item.quantity + qty } : item);
          }
          return [...prev, { ...box, quantity: qty }];
        });
        showMessage(`🛒 已將 ${qty} 個 ${box.name} 加入清單`);
        setQuantities(prev => ({ ...prev, [box.id]: 1 }));
      };

      const updateCartItemQuantity = (id, delta) => {
        setCart(prev => prev.map(item => {
          if (item.id === id) {
            const newQty = item.quantity + delta;
            return newQty > 0 ? { ...item, quantity: newQty } : item;
          }
          return item;
        }).filter(item => item.quantity > 0));
      };

      const removeFromCart = (id) => {
        setCart(prev => prev.filter(item => item.id !== id));
      };

      const cartTotal = cart.reduce((sum, item) => sum + (item.price || 0) * item.quantity, 0);

      const generatePDF = async () => {
        if (cart.length === 0) return;
        setIsGeneratingPDF(true);

        const pdfContainer = document.getElementById('pdf-export-container');
        if (pdfContainer) {
          pdfContainer.style.left = '0px';
          pdfContainer.style.top = '0px';
        }

        const element = pdfRef.current;
        const opt = {
          margin:       10,
          filename:     `Jennys_space_報價單_${new Date().toISOString().slice(0, 10)}.pdf`,
          image:        { type: 'jpeg', quality: 1 },
          html2canvas:  { scale: 2, useCORS: true, scrollX: 0, scrollY: 0, windowWidth: 800 }, 
          jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
        };

        try {
          await window.html2pdf().set(opt).from(element).save();
          showMessage("📄 報價單 PDF 已成功下載！");
        } catch (error) {
          console.error("PDF 產生失敗", error);
          showMessage("❌ 報價單產生失敗，請稍後再試");
        } finally {
          if (pdfContainer) {
             pdfContainer.style.left = '-10000px';
          }
          setIsGeneratingPDF(false);
        }
      };

      const fb = useMemo(() => {
        if (firebaseConfig && firebaseConfig.apiKey && firebaseConfig.apiKey !== "AIzaSyXXXXXXXXXXXXXXX") {
            try {
              const app = window.firebaseAPI.initializeApp(firebaseConfig);
              return {
                  app,
                  auth: window.firebaseAPI.getAuth(app),
                  db: window.firebaseAPI.getFirestore(app)
              };
            } catch (e) {
              console.error("Firebase 初始化失敗：", e);
              return null;
            }
        }
        return null;
      }, []);

      useEffect(() => {
        if (!fb) {
          setBoxes(defaultBoxes.map((box, index) => ({ ...box, id: `local-${index}` })));
          setIsLoading(false);
          return;
        }

        const initAuth = async () => {
          try {
            await window.firebaseAPI.signInAnonymously(fb.auth);
          } catch (error) {
            console.error("登入失敗:", error);
            showMessage("連線至雲端失敗，請重新整理頁面");
            setIsLoading(false);
          }
        };

        initAuth();

        const unsubscribeAuth = window.firebaseAPI.onAuthStateChanged(fb.auth, (currentUser) => {
          setUser(currentUser);
          if (!currentUser) setIsLoading(false);
        });

        return () => unsubscribeAuth();
      }, [fb]);

      useEffect(() => {
        if (!user || !fb || !fb.db) return;
        setIsLoading(true);
        const boxesRef = window.firebaseAPI.collection(fb.db, 'artifacts', appId, 'public', 'data', 'boxes');
        
        const unsubscribeSnapshot = window.firebaseAPI.onSnapshot(boxesRef, (snapshot) => {
          const loadedBoxes = [];
          snapshot.forEach((doc) => {
            loadedBoxes.push({ id: doc.id, ...doc.data() });
          });
          loadedBoxes.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
          setBoxes(loadedBoxes);
          setIsLoading(false);
          setIsCloudSyncing(true);
        }, (error) => {
          console.error("讀取資料失敗:", error);
          showMessage("讀取雲端資料失敗，請確認設定");
          setIsLoading(false);
          setIsCloudSyncing(false);
        });

        return () => unsubscribeSnapshot();
      }, [user, fb]);

      const showMessage = (message) => {
        setModalMessage(message);
        setTimeout(() => setModalMessage(null), 3000);
      };

      const handleSearchChange = (e) => {
        const { name, value } = e.target;
        setSearchParams(prev => ({ ...prev, [name]: value }));
      };

      const handleNewBoxChange = (e) => {
        const { name, value } = e.target;
        setNewBox(prev => ({ ...prev, [name]: value }));
      };

      const handleEditBoxChange = (e) => {
        const { name, value } = e.target;
        setEditingBox(prev => ({ ...prev, [name]: value }));
      };

      const handleImageUpload = (e, isEditing = false) => {
        const file = e.target.files[0];
        if (file) {
          if(file.size > 500 * 1024) {
             showMessage("圖片檔案過大，請上傳小於 500KB 的圖片");
             return;
          }
          const reader = new FileReader();
          reader.onloadend = () => {
            if (isEditing) {
              setEditingBox(prev => ({ ...prev, image: reader.result }));
            } else {
              setPreviewImage(reader.result);
              setNewBox(prev => ({ ...prev, image: reader.result }));
            }
          };
          reader.readAsDataURL(file);
        }
      };

      const handleAddBox = async (e) => {
        e.preventDefault();
        if (!newBox.name || !newBox.l || !newBox.w || !newBox.h) {
          showMessage("請填寫必填欄位 (名稱、寬度、深度、高度)");
          return;
        }
        
        const boxToAdd = {
          name: newBox.name,
          brand: newBox.brand || "",
          category: newBox.category || "box", 
          l: Number(newBox.l),
          w: Number(newBox.w),
          h: Number(newBox.h),
          iw: newBox.iw ? Number(newBox.iw) : null,
          il: newBox.il ? Number(newBox.il) : null,
          ih: newBox.ih ? Number(newBox.ih) : null,
          price: newBox.price ? Number(newBox.price) : null,
          url: newBox.url || "",
          image: newBox.image || "https://placehold.co/300x200/e2e8f0/64748b?text=No+Image",
          createdAt: Date.now()
        };

        if (user && fb && fb.db) {
          try {
            const boxesRef = window.firebaseAPI.collection(fb.db, 'artifacts', appId, 'public', 'data', 'boxes');
            await window.firebaseAPI.addDoc(boxesRef, boxToAdd);
            showMessage("📦 收納品已成功加入雲端！");
          } catch (error) {
            console.error("新增失敗: ", error);
            showMessage("❌ 新增失敗，請確認您的資料庫權限設定");
          }
        } else {
          setBoxes([{ id: Date.now().toString(), ...boxToAdd }, ...boxes]);
          showMessage("收納品已加入 (本地測試模式)");
        }

        setNewBox({ name: '', brand: '', category: 'box', l: '', w: '', h: '', iw: '', il: '', ih: '', price: '', url: '', image: '' });
        setPreviewImage(null);
        if (fileInputRef.current) fileInputRef.current.value = '';
      };

      const handleUpdateBox = async (e) => {
        e.preventDefault();
        if (!editingBox.name || !editingBox.l || !editingBox.w || !editingBox.h) {
          showMessage("請填寫必填欄位 (名稱、寬度、深度、高度)");
          return;
        }

        const boxToUpdate = {
          name: editingBox.name,
          brand: editingBox.brand || "",
          category: editingBox.category || "box", 
          l: Number(editingBox.l),
          w: Number(editingBox.w),
          h: Number(editingBox.h),
          iw: editingBox.iw ? Number(editingBox.iw) : null,
          il: editingBox.il ? Number(editingBox.il) : null,
          ih: editingBox.ih ? Number(editingBox.ih) : null,
          price: editingBox.price ? Number(editingBox.price) : null,
          url: editingBox.url || "",
          image: editingBox.image || "https://placehold.co/300x200/e2e8f0/64748b?text=No+Image"
        };

        if (user && fb && fb.db) {
          try {
            const boxDocRef = window.firebaseAPI.doc(fb.db, 'artifacts', appId, 'public', 'data', 'boxes', editingBox.id);
            await window.firebaseAPI.updateDoc(boxDocRef, boxToUpdate);
            showMessage("✅ 編輯成功！");
          } catch (error) {
            console.error("更新失敗: ", error);
            showMessage("❌ 更新失敗");
          }
        } else {
          setBoxes(boxes.map(b => b.id === editingBox.id ? { ...b, ...boxToUpdate } : b));
          showMessage("已更新 (本地測試模式)");
        }

        setEditingBox(null);
      };

      const handleDeleteBox = async (id) => {
        if (!window.confirm("確定要刪除這個收納品嗎？")) return;

        if (user && fb && fb.db) {
          try {
            await window.firebaseAPI.deleteDoc(window.firebaseAPI.doc(fb.db, 'artifacts', appId, 'public', 'data', 'boxes', id));
            showMessage("🗑️ 已刪除該收納品");
          } catch (error) {
            console.error("刪除失敗: ", error);
            showMessage("刪除失敗");
          }
        } else {
          setBoxes(boxes.filter(box => box.id !== id));
          showMessage("已刪除 (本地測試模式)");
        }
      };

      const getCategoryDisplay = (category) => {
        if (category === 'drawer') return { label: '抽屜箱', bgClass: 'bg-amber-100 text-amber-800 border-amber-200' };
        if (category === 'shelf') return { label: '層架', bgClass: 'bg-blue-100 text-blue-800 border-blue-200' };
        if (category === 'other') return { label: '其他', bgClass: 'bg-teal-100 text-teal-800 border-teal-200' };
        return { label: '收納盒', bgClass: 'bg-stone-100 text-stone-700 border-stone-200' };
      };

      const filteredBoxes = useMemo(() => {
        let wMin = 0, wMax = Infinity, lMin = 0, lMax = Infinity, hMin = 0, hMax = Infinity;

        if (sizeSearchMode === 'quick') {
          const wRangeObj = WIDTH_RANGES.find(r => r.id === searchParams.wRange) || WIDTH_RANGES[0];
          const lRangeObj = DEPTH_RANGES.find(r => r.id === searchParams.lRange) || DEPTH_RANGES[0];
          const hRangeObj = HEIGHT_RANGES.find(r => r.id === searchParams.hRange) || HEIGHT_RANGES[0];

          wMin = wRangeObj.min;
          wMax = wRangeObj.max;
          lMin = lRangeObj.min;
          lMax = lRangeObj.max;
          hMin = hRangeObj.min;
          hMax = hRangeObj.max;
        } else {
          wMax = searchParams.w ? Number(searchParams.w) : Infinity;
          lMax = searchParams.l ? Number(searchParams.l) : Infinity;
          hMax = searchParams.h ? Number(searchParams.h) : Infinity;
        }

        const filterCat = searchParams.category;

        return boxes.map(box => {
          const fitNormal = 
            box.w >= wMin && box.w <= wMax && 
            box.l >= lMin && box.l <= lMax && 
            box.h >= hMin && box.h <= hMax;
          const fitRotated = 
            box.l >= wMin && box.l <= wMax && 
            box.w >= lMin && box.w <= lMax && 
            box.h >= hMin && box.h <= hMax;
          return { ...box, fitNormal, fitRotated, isMatch: fitNormal || fitRotated };
        }).filter(box => {
          if (filterCat !== 'all' && box.category !== filterCat) return false;
          if (wMin === 0 && wMax === Infinity && lMin === 0 && lMax === Infinity && hMin === 0 && hMax === Infinity) return true;
          return box.isMatch;
        }).sort((a, b) => {
          if (a.fitNormal && !b.fitNormal) return -1;
          if (!a.fitNormal && b.fitNormal) return 1;
          return 0;
        });
      }, [boxes, searchParams, sizeSearchMode]);

      if (isLoading) {
        return (
          <div className="min-h-screen flex flex-col items-center justify-center text-stone-500 bg-[#f7f5f0]">
            <i className="fas fa-spinner fa-spin text-3xl mb-4 text-stone-400"></i>
            <p className="tracking-widest">正在載入您的專屬資料庫...</p>
          </div>
        );
      }

      return (
        <div className="min-h-screen bg-[#f7f5f0] text-stone-800 font-sans relative pb-20 z-0 overflow-x-hidden">
          
          {modalMessage && (
            <div className="fixed top-20 left-1/2 transform -translate-x-1/2 z-50 animate-bounce">
              <div className="bg-stone-800 text-white px-6 py-3 rounded-full shadow-lg font-medium text-sm flex items-center tracking-wide">
                {modalMessage}
              </div>
            </div>
          )}

          {editingBox && (
            <div className="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4 overflow-y-auto">
              <div className="bg-white rounded-2xl shadow-xl w-full max-w-2xl overflow-hidden animate-[fadeIn_0.2s_ease-out]">
                <div className="p-6 border-b border-stone-100 flex justify-between items-center bg-stone-50">
                  <h3 className="text-lg font-bold text-stone-700"><i className="fas fa-edit mr-2"></i>編輯收納品</h3>
                  <button onClick={() => setEditingBox(null)} className="text-stone-400 hover:text-stone-700 focus:outline-none">
                    <i className="fas fa-times text-xl"></i>
                  </button>
                </div>
                <form onSubmit={handleUpdateBox} className="p-6 grid grid-cols-1 md:grid-cols-2 gap-6 max-h-[70vh] overflow-y-auto">
                  <div>
                    <label className="block text-sm font-medium text-stone-500 mb-2">更新圖片</label>
                    <div className="border-2 border-dashed border-stone-200 rounded-2xl bg-stone-50 hover:bg-stone-100 transition-colors flex flex-col items-center justify-center cursor-pointer relative overflow-hidden aspect-square" onClick={() => editFileInputRef.current?.click()}>
                      {editingBox.image ? (
                        <img src={editingBox.image} alt="Preview" className="w-full h-full object-cover" />
                      ) : (
                        <div className="flex flex-col items-center text-stone-400 p-4">
                          <i className="fas fa-camera text-3xl mb-3 opacity-40"></i>
                        </div>
                      )}
                      <input type="file" accept="image/jpeg, image/png, image/webp" className="hidden" ref={editFileInputRef} onChange={(e) => handleImageUpload(e, true)} />
                    </div>
                  </div>
                  
                  <div className="space-y-2">
                    <div>
                      <label className="block text-sm font-medium text-stone-500 mb-2">收納品種類 <span className="text-red-400">*</span></label>
                      <div className="flex space-x-4">
                        <label className="flex items-center space-x-2 cursor-pointer">
                          <input type="radio" name="category" value="box" checked={editingBox.category === 'box' || !editingBox.category} onChange={handleEditBoxChange} className="w-4 h-4 text-stone-600 focus:ring-stone-500" />
                          <span className="text-stone-700 text-sm">收納盒</span>
                        </label>
                        <label className="flex items-center space-x-2 cursor-pointer">
                          <input type="radio" name="category" value="drawer" checked={editingBox.category === 'drawer'} onChange={handleEditBoxChange} className="w-4 h-4 text-amber-600 focus:ring-amber-500" />
                          <span className="text-stone-700 text-sm">抽屜箱</span>
                        </label>
                        <label className="flex items-center space-x-2 cursor-pointer">
                          <input type="radio" name="category" value="shelf" checked={editingBox.category === 'shelf'} onChange={handleEditBoxChange} className="w-4 h-4 text-blue-600 focus:ring-blue-500" />
                          <span className="text-stone-700 text-sm">層架</span>
                        </label>
                        <label className="flex items-center space-x-2 cursor-pointer">
                          <input type="radio" name="category" value="other" checked={editingBox.category === 'other'} onChange={handleEditBoxChange} className="w-4 h-4 text-teal-600 focus:ring-teal-500" />
                          <span className="text-stone-700 text-sm">其他</span>
                        </label>
                      </div>
                    </div>

                    <div>
                      <label className="block text-sm font-medium text-stone-500 mb-1">產品名稱 <span className="text-red-400">*</span></label>
                      <input required type="text" name="name" value={editingBox.name} onChange={handleEditBoxChange} className="w-full px-3 py-2 bg-stone-50 border border-stone-200 rounded-lg focus:ring-2 focus:ring-stone-400 focus:outline-none" />
                    </div>
                    <div>
                      <label className="block text-sm font-medium text-stone-500 mb-1">品牌</label>
                      <input type="text" name="brand" value={editingBox.brand} onChange={handleEditBoxChange} className="w-full px-3 py-2 bg-stone-50 border border-stone-200 rounded-lg focus:ring-2 focus:ring-stone-400 focus:outline-none" />
                    </div>
                    <div className="grid grid-cols-2 gap-3">
                      <div>
                        <label className="block text-sm font-medium text-stone-500 mb-1">金額 (NT$)</label>
                        <input type="number" min="0" name="price" value={editingBox.price || ''} onChange={handleEditBoxChange} className="w-full px-3 py-2 bg-stone-50 border border-stone-200 rounded-lg focus:ring-2 focus:ring-stone-400 focus:outline-none" />
                      </div>
                      <div>
                        <label className="block text-sm font-medium text-stone-500 mb-1">網址連結</label>
                        <input type="url" name="url" value={editingBox.url || ''} onChange={handleEditBoxChange} className="w-full px-3 py-2 bg-stone-50 border border-stone-200 rounded-lg focus:ring-2 focus:ring-stone-400 focus:outline-none" placeholder="https://..." />
                      </div>
                    </div>
                    <div className="grid grid-cols-3 gap-2 sm:gap-3">
                      <div>
                        <label className="block text-xs sm:text-sm font-medium text-stone-500 mb-1">寬度 W (cm)*</label>
                        <input required type="number" min="0" step="0.1" name="w" value={editingBox.w} onChange={handleEditBoxChange} className="w-full min-w-0 px-2 sm:px-3 py-2 bg-stone-50 border border-stone-200 rounded-lg focus:ring-2 focus:ring-stone-400 focus:outline-none font-mono text-sm" />
                      </div>
                      <div>
                        <label className="block text-xs sm:text-sm font-medium text-stone-500 mb-1">深度 D (cm)*</label>
                        <input required type="number" min="0" step="0.1" name="l" value={editingBox.l} onChange={handleEditBoxChange} className="w-full min-w-0 px-2 sm:px-3 py-2 bg-stone-50 border border-stone-200 rounded-lg focus:ring-2 focus:ring-stone-400 focus:outline-none font-mono text-sm" />
                      </div>
                      <div>
                        <label className="block text-xs sm:text-sm font-medium text-stone-500 mb-1">高度 H (cm)*</label>
                        <input required type="number" min="0" step="0.1" name="h" value={editingBox.h} onChange={handleEditBoxChange} className="w-full min-w-0 px-2 sm:px-3 py-2 bg-stone-50 border border-stone-200 rounded-lg focus:ring-2 focus:ring-stone-400 focus:outline-none font-mono text-sm" />
                      </div>
                    </div>
                    <div className="grid grid-cols-3 gap-2 sm:gap-3 mt-3">
                      <div>
                        <label className="block text-xs sm:text-sm font-medium text-stone-500 mb-1">內寬 W (cm)</label>
                        <input type="number" min="0" step="0.1" name="iw" value={editingBox.iw || ''} onChange={handleEditBoxChange} className="w-full min-w-0 px-2 sm:px-3 py-2 bg-stone-50 border border-stone-200 rounded-lg focus:ring-2 focus:ring-stone-400 focus:outline-none font-mono text-sm placeholder-stone-300" placeholder="選填" />
                      </div>
                      <div>
                        <label className="block text-xs sm:text-sm font-medium text-stone-500 mb-1">內深 D (cm)</label>
                        <input type="number" min="0" step="0.1" name="il" value={editingBox.il || ''} onChange={handleEditBoxChange} className="w-full min-w-0 px-2 sm:px-3 py-2 bg-stone-50 border border-stone-200 rounded-lg focus:ring-2 focus:ring-stone-400 focus:outline-none font-mono text-sm placeholder-stone-300" placeholder="選填" />
                      </div>
                      <div>
                        <label className="block text-xs sm:text-sm font-medium text-stone-500 mb-1">內高 H (cm)</label>
                        <input type="number" min="0" step="0.1" name="ih" value={editingBox.ih || ''} onChange={handleEditBoxChange} className="w-full min-w-0 px-2 sm:px-3 py-2 bg-stone-50 border border-stone-200 rounded-lg focus:ring-2 focus:ring-stone-400 focus:outline-none font-mono text-sm placeholder-stone-300" placeholder="選填" />
                      </div>
                    </div>
                  </div>
                  <div className="md:col-span-2 flex justify-end space-x-3 mt-4 pt-4 border-t border-stone-100">
                    <button type="button" onClick={() => setEditingBox(null)} className="px-5 py-2 rounded-lg text-stone-600 bg-stone-100 hover:bg-stone-200 transition-colors">取消</button>
                    <button type="submit" className="px-5 py-2 rounded-lg text-white bg-[#4a4a4a] hover:bg-[#333333] transition-colors shadow-sm">儲存修改</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          <nav className="bg-white shadow-sm sticky top-0 z-20">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
              <div className="flex justify-between h-16">
                <div className="flex items-center">
                  <span className="font-bold text-xl tracking-wider text-stone-700 hidden sm:inline">Jenny's 收納品資料庫</span>
                  <span className="font-bold text-xl tracking-wider text-stone-700 sm:hidden">O-Space</span>
                  
                  <div className="ml-4 flex items-center mt-1" title={isCloudSyncing ? "資料已安全同步至雲端" : "目前為離線測試模式，資料無法保存"}>
                    {isCloudSyncing ? (
                      <i className="fas fa-cloud text-green-500 text-sm"></i>
                    ) : (
                      <i className="fas fa-cloud text-stone-300 opacity-50 text-sm"></i>
                    )}
                  </div>
                </div>
                <div className="flex items-center space-x-2 sm:space-x-4">
                  <button onClick={() => setActiveTab('search')} className={`px-3 py-2 rounded-md text-sm font-medium transition-colors flex items-center ${activeTab === 'search' ? 'bg-stone-100 text-stone-900' : 'text-stone-500 hover:text-stone-700'}`}>
                    <i className="fas fa-search sm:mr-2"></i> <span className="hidden sm:inline">找尺寸</span>
                  </button>
                  <button onClick={() => setActiveTab('manage')} className={`px-3 py-2 rounded-md text-sm font-medium transition-colors flex items-center ${activeTab === 'manage' ? 'bg-stone-100 text-stone-900' : 'text-stone-500 hover:text-stone-700'}`}>
                    <i className="fas fa-plus sm:mr-2"></i> <span className="hidden sm:inline">管理資料庫</span>
                  </button>
                </div>
              </div>
            </div>
          </nav>

          <main className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 flex flex-col lg:flex-row gap-8 relative z-10">
            
            <div className="flex-1 w-full overflow-hidden">

            {activeTab === 'search' && (
              <div className="space-y-2 animate-[fadeIn_0.5s_ease-out]">
                
                <div className="bg-white p-6 rounded-2xl shadow-sm border border-stone-100">
                  <div className="mb-6">
                    <h2 className="text-lg font-semibold mb-4 text-stone-700 flex items-center">
                1. 選擇收納品種類 
                    </h2>
                    <div className="flex flex-wrap gap-1.5 sm:gap-3">
                      {[
                        { id: 'all', label: '全部' },
                        { id: 'box', label: '收納盒' },
                        { id: 'drawer', label: '抽屜箱' },
                        { id: 'shelf', label: '層架' },
                        { id: 'other', label: '其他' }
                      ].map(cat => (
                        <button
                          key={cat.id}
                          onClick={() => setSearchParams(prev => ({ ...prev, category: cat.id }))}
                          className={`px-3 py-1.5 sm:px-5 sm:py-2 rounded-full text-xs sm:text-sm font-medium transition-all duration-200 focus:outline-none ${
                            searchParams.category === cat.id
                              ? 'bg-stone-800 text-white shadow-md scale-105'
                              : 'bg-stone-100 text-stone-600 hover:bg-stone-200 hover:scale-105'
                          }`}
                        >
                          {cat.label}
                        </button>
                      ))}
                    </div>
                  </div>

                  <hr className="border-stone-100 my-6" />

                  <div>
                    <div className="flex justify-between items-center mb-6">
                      <h2 className="text-lg font-semibold text-stone-700 flex items-center">
                        2. 選擇空間尺寸
                      </h2>
                      <div className="flex bg-stone-100 p-1 rounded-lg">
                        <button
                          onClick={() => setSizeSearchMode('quick')}
                          className={`px-3 py-1.5 text-xs sm:text-sm font-medium rounded-md transition-all ${
                            sizeSearchMode === 'quick' ? 'bg-white text-stone-800 shadow-sm' : 'text-stone-500 hover:text-stone-700'
                          }`}
                        >
                          快速選擇
                        </button>
                        <button
                          onClick={() => setSizeSearchMode('manual')}
                          className={`px-3 py-1.5 text-xs sm:text-sm font-medium rounded-md transition-all ${
                            sizeSearchMode === 'manual' ? 'bg-white text-stone-800 shadow-sm' : 'text-stone-500 hover:text-stone-700'
                          }`}
                        >
                          手動輸入
                        </button>
                      </div>
                    </div>
                    
                    {sizeSearchMode === 'quick' && (
                      <div className="space-y-2 animate-[fadeIn_0.3s_ease-out]">
                        <div>
                          <label className="block text-sm font-bold text-stone-600 mb-2">寬度 W (cm)</label>
                          <div className="flex flex-wrap gap-1.5 sm:gap-2">
                            {WIDTH_RANGES.map(range => (
                              <button
                                key={range.id}
                                onClick={() => setSearchParams(prev => ({ ...prev, wRange: range.id }))}
                                className={`px-3 py-1.5 sm:px-4 sm:py-1.5 rounded-full text-xs sm:text-sm font-medium transition-all duration-200 focus:outline-none ${
                                  searchParams.wRange === range.id
                                    ? 'bg-stone-600 text-white shadow-sm scale-105'
                                    : 'bg-white border border-stone-200 text-stone-500 hover:bg-stone-50 hover:scale-105'
                                }`}
                              >
                                {range.label}
                              </button>
                            ))}
                          </div>
                        </div>

                        <div>
                          <label className="block text-sm font-bold text-stone-600 mb-2">深度 D (cm)</label>
                          <div className="flex flex-wrap gap-1.5 sm:gap-2">
                            {DEPTH_RANGES.map(range => (
                              <button
                                key={range.id}
                                onClick={() => setSearchParams(prev => ({ ...prev, lRange: range.id }))}
                                className={`px-3 py-1.5 sm:px-4 sm:py-1.5 rounded-full text-xs sm:text-sm font-medium transition-all duration-200 focus:outline-none ${
                                  searchParams.lRange === range.id
                                    ? 'bg-stone-600 text-white shadow-sm scale-105'
                                    : 'bg-white border border-stone-200 text-stone-500 hover:bg-stone-50 hover:scale-105'
                                }`}
                              >
                                {range.label}
                              </button>
                            ))}
                          </div>
                        </div>

                        <div>
                          <label className="block text-sm font-bold text-stone-600 mb-2">高度 H (cm)</label>
                          <div className="flex flex-wrap gap-1.5 sm:gap-2">
                            {HEIGHT_RANGES.map(range => (
                              <button
                                key={range.id}
                                onClick={() => setSearchParams(prev => ({ ...prev, hRange: range.id }))}
                                className={`px-3 py-1.5 sm:px-4 sm:py-1.5 rounded-full text-xs sm:text-sm font-medium transition-all duration-200 focus:outline-none ${
                                  searchParams.hRange === range.id
                                    ? 'bg-stone-600 text-white shadow-sm scale-105'
                                    : 'bg-white border border-stone-200 text-stone-500 hover:bg-stone-50 hover:scale-105'
                                }`}
                              >
                                {range.label}
                              </button>
                            ))}
                          </div>
                        </div>
                      </div>
                    )}

                    {sizeSearchMode === 'manual' && (
                      <div className="grid grid-cols-1 md:grid-cols-3 gap-4 animate-[fadeIn_0.3s_ease-out]">
                        <div>
                          <label className="block text-sm font-bold text-stone-500 mb-1">寬度 W (cm)</label>
                          <input type="number" step="0.1" min="0" name="w" value={searchParams.w} onChange={handleSearchChange} className="w-full px-4 py-2 bg-stone-50 border border-stone-200 rounded-lg focus:ring-2 focus:ring-stone-400 focus:outline-none" placeholder="" />
                        </div>
                        <div>
                          <label className="block text-sm font-bold text-stone-500 mb-1">深度 D (cm)</label>
                          <input type="number" step="0.1" min="0" name="l" value={searchParams.l} onChange={handleSearchChange} className="w-full px-4 py-2 bg-stone-50 border border-stone-200 rounded-lg focus:ring-2 focus:ring-stone-400 focus:outline-none" placeholder="" />
                        </div>
                        <div>
                          <label className="block text-sm font-bold text-stone-500 mb-1">高度 H (cm)</label>
                          <input type="number" step="0.1" min="0" name="h" value={searchParams.h} onChange={handleSearchChange} className="w-full px-4 py-2 bg-stone-50 border border-stone-200 rounded-lg focus:ring-2 focus:ring-stone-400 focus:outline-none" placeholder="" />
                        </div>
                      </div>
                    )}
                  </div>
                </div>

                <div>
                  <div className="mb-4 text-stone-600 font-medium tracking-wide">篩選結果：共 {filteredBoxes.length} 個合適的收納品</div>
                  
                  {filteredBoxes.length === 0 ? (
                    <div className="text-center py-20 bg-white rounded-2xl border border-stone-100 border-dashed">
                      <i className="fas fa-box-open w-12 h-12 text-stone-200 mx-auto mb-3 text-5xl"></i>
                      <p className="text-stone-500 mt-4 tracking-wide">目前沒有符合條件的收納品</p>
                      <button onClick={() => setActiveTab('manage')} className="mt-4 text-stone-600 underline hover:text-stone-900 transition-colors">前往新增收納品</button>
                    </div>
                  ) : (
                    <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
                      {filteredBoxes.map(box => {
                        const catInfo = getCategoryDisplay(box.category);
                        let isSearchingSize = false;
                        if (sizeSearchMode === 'quick') {
                           isSearchingSize = searchParams.lRange !== 'all' || searchParams.wRange !== 'all' || searchParams.hRange !== 'all';
                        } else {
                           isSearchingSize = searchParams.l || searchParams.w || searchParams.h;
                        }
                        
                        return (
                          <div key={box.id} className="bg-white rounded-2xl overflow-hidden shadow-sm hover:shadow-md transition-shadow border border-stone-100 group flex flex-col relative">
                            <div className="aspect-square bg-stone-50 relative overflow-hidden flex items-center justify-center">
                              <img src={box.image} alt={box.name} className="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500" />
                              <div className="absolute top-3 right-3 flex flex-col gap-2">
                                {box.fitNormal && isSearchingSize && (
                                  <span className="bg-green-100/90 backdrop-blur-sm text-green-700 text-xs px-2.5 py-1 rounded-full font-medium flex items-center shadow-sm">
                                    <i className="fas fa-check-circle mr-1.5"></i> 正放
                                  </span>
                                )}
                                {!box.fitNormal && box.fitRotated && isSearchingSize && (
                                  <span className="bg-amber-100/90 backdrop-blur-sm text-amber-700 text-xs px-2.5 py-1 rounded-full font-medium flex items-center shadow-sm">
                                    <i className="fas fa-sync-alt mr-1.5"></i> 轉向
                                  </span>
                                )}
                              </div>
                              {box.price && (
                                  <div className="absolute top-3 left-3 bg-white/90 backdrop-blur-sm text-stone-800 text-xs px-2.5 py-1 rounded-full font-bold shadow-sm">
                                      NT$ {box.price}
                                  </div>
                              )}
                            </div>
                            <div className="p-5 flex-1 flex flex-col">
                              <div className="flex justify-between items-start mb-1.5">
                                  <div className="flex items-center gap-2">
                                    <div className="text-xs text-stone-400 font-medium tracking-wider">{box.brand || '無品牌'}</div>
                                  </div>
                                  {box.url && (
                                      <a href={box.url} target="_blank" rel="noreferrer" className="text-stone-400 hover:text-blue-500 transition-colors" title="前往商品頁面">
                                          <i className="fas fa-external-link-alt text-xs"></i>
                                      </a>
                                  )}
                              </div>
                              <h3 className="font-semibold text-stone-800 text-base leading-tight mb-3 truncate">{box.name}</h3>
                              
                              {/* 完美對齊的外寸與內寸區塊 */}
                              <div className="flex flex-col bg-[#f7f5f0] p-2.5 rounded-xl border border-stone-100 font-mono text-xs">
                                <div className="flex items-center pb-1.5 mb-1.5 border-b border-stone-200/50">
                                   <div className="w-6"></div>
                                   <div className="flex-1 text-center text-[10px] text-stone-400 font-sans tracking-wider">寬度 W</div>
                                   <div className="w-3"></div>
                                   <div className="flex-1 text-center text-[10px] text-stone-400 font-sans tracking-wider">深度 D</div>
                                   <div className="w-3"></div>
                                   <div className="flex-1 text-center text-[10px] text-stone-400 font-sans tracking-wider">高度 H</div>
                                </div>
                                <div className="flex items-center">
                                   <div className="w-6 text-[10px] text-stone-700 font-sans text-center">外</div>
                                   <div className="flex-1 text-center font-medium text-stone-700">{box.w}</div>
                                   <div className="text-stone-300 w-3 text-center text-[10px]">×</div>
                                   <div className="flex-1 text-center font-medium text-stone-700">{box.l}</div>
                                   <div className="text-stone-300 w-3 text-center text-[10px]">×</div>
                                   <div className="flex-1 text-center font-medium text-stone-700">{box.h}</div>
                                </div>
                                {(box.iw || box.il || box.ih) && (
                                  <div className="flex items-center pt-1.5 mt-1.5 border-t border-stone-200/50">
                                     <div className="w-6 text-[10px] text-stone-400 font-sans text-center">內</div>
                                     <div className="flex-1 text-center font-medium text-stone-400">{box.iw || '-'}</div>
                                     <div className="text-stone-300 w-3 text-center text-[10px]">×</div>
                                     <div className="flex-1 text-center font-medium text-stone-400">{box.il || '-'}</div>
                                     <div className="text-stone-300 w-3 text-center text-[10px]">×</div>
                                     <div className="flex-1 text-center font-medium text-stone-400">{box.ih || '-'}</div>
                                  </div>
                                )}
                              </div>
                              
                              <div className="mt-4 pt-3 border-t flex items-center justify-between">
                                <span className={`inline-block text-xs px-2.5 py-1 rounded-md border font-medium ${catInfo.bgClass}`}>
                                  {catInfo.label}
                                </span>
                                <button onClick={() => addToCart(box)} className="px-3 py-1.5 bg-stone-800 text-white rounded-lg text-xs font-medium hover:bg-stone-900">加入清單</button>
                              </div>

                            </div>
                          </div>
                        )
                      })}
                    </div>
                  )}
                </div>
              </div>
            )}

            {activeTab === 'manage' && (
              <div className="space-y-2 animate-[fadeIn_0.5s_ease-out]">
                <div className="bg-white p-6 rounded-2xl shadow-sm border border-stone-100">
                  <h2 className="text-lg font-semibold mb-6 text-stone-700 flex items-center">
                    <i className="fas fa-plus-circle w-5 h-5 mr-2 text-stone-400"></i> 新增收納品
                  </h2>
                  <form onSubmit={handleAddBox} className="grid grid-cols-1 md:grid-cols-2 gap-8">
                    
                    {/* 左側：輸入表單區塊 (在 DOM 順序移到前面，自然排在左邊) */}
                    <div className="space-y-2">

                      <div className="bg-stone-50 p-3 rounded-xl border border-stone-100">
                        <label className="block text-sm font-medium text-stone-500 mb-2">收納品種類 <span className="text-red-400">*</span></label>
                        <div className="flex space-x-6">
                          <label className="flex items-center space-x-2 cursor-pointer group">
                            <div className={`w-5 h-5 rounded-full border flex items-center justify-center ${newBox.category === 'box' ? 'border-stone-600' : 'border-stone-300 group-hover:border-stone-400'}`}>
                              {newBox.category === 'box' && <div className="w-2.5 h-2.5 bg-stone-600 rounded-full"></div>}
                            </div>
                            <input type="radio" name="category" value="box" checked={newBox.category === 'box'} onChange={handleNewBoxChange} className="hidden" />
                            <span className="text-stone-700 text-sm font-medium">收納盒</span>
                          </label>
                          <label className="flex items-center space-x-2 cursor-pointer group">
                            <div className={`w-5 h-5 rounded-full border flex items-center justify-center ${newBox.category === 'drawer' ? 'border-amber-600' : 'border-stone-300 group-hover:border-stone-400'}`}>
                              {newBox.category === 'drawer' && <div className="w-2.5 h-2.5 bg-amber-600 rounded-full"></div>}
                            </div>
                            <input type="radio" name="category" value="drawer" checked={newBox.category === 'drawer'} onChange={handleNewBoxChange} className="hidden" />
                            <span className="text-stone-700 text-sm font-medium">抽屜箱</span>
                          </label>
                          <label className="flex items-center space-x-2 cursor-pointer group">
                            <div className={`w-5 h-5 rounded-full border flex items-center justify-center ${newBox.category === 'shelf' ? 'border-blue-600' : 'border-stone-300 group-hover:border-stone-400'}`}>
                              {newBox.category === 'shelf' && <div className="w-2.5 h-2.5 bg-blue-600 rounded-full"></div>}
                            </div>
                            <input type="radio" name="category" value="shelf" checked={newBox.category === 'shelf'} onChange={handleNewBoxChange} className="hidden" />
                            <span className="text-stone-700 text-sm font-medium">層架</span>
                          </label>
                          <label className="flex items-center space-x-2 cursor-pointer group">
                            <div className={`w-5 h-5 rounded-full border flex items-center justify-center ${newBox.category === 'other' ? 'border-teal-600' : 'border-stone-300 group-hover:border-stone-400'}`}>
                              {newBox.category === 'other' && <div className="w-2.5 h-2.5 bg-teal-600 rounded-full"></div>}
                            </div>
                            <input type="radio" name="category" value="other" checked={newBox.category === 'other'} onChange={handleNewBoxChange} className="hidden" />
                            <span className="text-stone-700 text-sm font-medium">其他</span>
                          </label>
                        </div>
                      </div>

                      <div>
                        <label className="block text-sm font-medium text-stone-500 mb-1">產品名稱 <span className="text-red-400">*</span></label>
                        <input required type="text" name="name" value={newBox.name} onChange={handleNewBoxChange} className="w-full px-4 py-2 bg-stone-50 border border-stone-200 rounded-lg focus:ring-2 focus:ring-stone-400 focus:outline-none transition-shadow" placeholder={newBox.category === 'drawer' ? "ex：聚丙烯抽屜收納箱" : newBox.category === 'shelf' ? "ex：層架組" : "ex：聚丙烯檔案盒"} />
                      </div>
                      <div className="grid grid-cols-2 gap-3">
                          <div>
                            <label className="block text-sm font-medium text-stone-500 mb-1">品牌</label>
                            <input type="text" name="brand" value={newBox.brand} onChange={handleNewBoxChange} className="w-full px-4 py-2 bg-stone-50 border border-stone-200 rounded-lg focus:ring-2 focus:ring-stone-400 focus:outline-none transition-shadow" placeholder="ex：無印良品" />
                          </div>
                          <div>
                            <label className="block text-sm font-medium text-stone-500 mb-1">金額 (NT$)</label>
                            <input type="number" min="0" name="price" value={newBox.price} onChange={handleNewBoxChange} className="w-full px-4 py-2 bg-stone-50 border border-stone-200 rounded-lg focus:ring-2 focus:ring-stone-400 focus:outline-none transition-shadow" placeholder="ex：299" />
                          </div>
                      </div>
                      <div>
                        <label className="block text-sm font-medium text-stone-500 mb-1">網址連結</label>
                        <input type="url" name="url" value={newBox.url} onChange={handleNewBoxChange} className="w-full px-4 py-2 bg-stone-50 border border-stone-200 rounded-lg focus:ring-2 focus:ring-stone-400 focus:outline-none transition-shadow" placeholder="ex：https://..." />
                      </div>
                      <div className="grid grid-cols-3 gap-2 sm:gap-3">
                        <div>
                          <label className="block text-xs sm:text-sm font-medium text-stone-500 mb-1">寬度 W (cm) <span className="text-red-400">*</span></label>
                          <input required type="number" min="0" step="0.1" name="w" value={newBox.w} onChange={handleNewBoxChange} className="w-full min-w-0 px-2 sm:px-3 py-2 bg-stone-50 border border-stone-200 rounded-lg focus:ring-2 focus:ring-stone-400 focus:outline-none font-mono text-sm" />
                        </div>
                        <div>
                          <label className="block text-xs sm:text-sm font-medium text-stone-500 mb-1">深度 D (cm) <span className="text-red-400">*</span></label>
                          <input required type="number" min="0" step="0.1" name="l" value={newBox.l} onChange={handleNewBoxChange} className="w-full min-w-0 px-2 sm:px-3 py-2 bg-stone-50 border border-stone-200 rounded-lg focus:ring-2 focus:ring-stone-400 focus:outline-none font-mono text-sm" />
                        </div>
                        <div>
                          <label className="block text-xs sm:text-sm font-medium text-stone-500 mb-1">高度 H (cm) <span className="text-red-400">*</span></label>
                          <input required type="number" min="0" step="0.1" name="h" value={newBox.h} onChange={handleNewBoxChange} className="w-full min-w-0 px-2 sm:px-3 py-2 bg-stone-50 border border-stone-200 rounded-lg focus:ring-2 focus:ring-stone-400 focus:outline-none font-mono text-sm" />
                        </div>
                      </div>
                      <div className="grid grid-cols-3 gap-2 sm:gap-3 mt-1">
                        <div>
                          <label className="block text-xs sm:text-sm font-medium text-stone-500 mb-1">內寬 W (cm)</label>
                          <input type="number" min="0" step="0.1" name="iw" value={newBox.iw} onChange={handleNewBoxChange} className="w-full min-w-0 px-2 sm:px-3 py-2 bg-stone-50 border border-stone-200 rounded-lg focus:ring-2 focus:ring-stone-400 focus:outline-none font-mono text-sm placeholder-stone-300" placeholder="" />
                        </div>
                        <div>
                          <label className="block text-xs sm:text-sm font-medium text-stone-500 mb-1">內深 D (cm)</label>
                          <input type="number" min="0" step="0.1" name="il" value={newBox.il} onChange={handleNewBoxChange} className="w-full min-w-0 px-2 sm:px-3 py-2 bg-stone-50 border border-stone-200 rounded-lg focus:ring-2 focus:ring-stone-400 focus:outline-none font-mono text-sm placeholder-stone-300" placeholder="" />
                        </div>
                        <div>
                          <label className="block text-xs sm:text-sm font-medium text-stone-500 mb-1">內高 H (cm)</label>
                          <input type="number" min="0" step="0.1" name="ih" value={newBox.ih} onChange={handleNewBoxChange} className="w-full min-w-0 px-2 sm:px-3 py-2 bg-stone-50 border border-stone-200 rounded-lg focus:ring-2 focus:ring-stone-400 focus:outline-none font-mono text-sm placeholder-stone-300" placeholder="選填" />
                        </div>
                      </div>
                    </div>

                    {/* 右側：上傳圖片區塊與新增按鈕 (在 DOM 順序移到後面，自然排在右邊) */}
                    <div className="flex flex-col h-full">
                      <div>
                        <label className="block text-sm font-medium text-stone-500 mb-2">上傳圖片</label>
                        <div className="border-2 border-dashed border-stone-200 rounded-2xl bg-stone-50 hover:bg-stone-100 transition-colors flex flex-col items-center justify-center cursor-pointer relative overflow-hidden aspect-square" onClick={() => fileInputRef.current?.click()}>
                          {previewImage ? (
                            <img src={previewImage} alt="Preview" className="w-full h-full object-cover" />
                          ) : (
                            <div className="flex flex-col items-center text-stone-400 p-4 text-center">
                              <i className="fas fa-camera text-3xl mb-3 opacity-40"></i>
                              <span className="text-sm font-medium tracking-wide">點擊上傳商品照</span>
                              <span className="text-xs mt-2 opacity-60">建議容量小於 500KB</span>
                            </div>
                          )}
                          <input type="file" accept="image/jpeg, image/png, image/webp" className="hidden" ref={fileInputRef} onChange={handleImageUpload} />
                        </div>
                      </div>
                      
                      <div className="mt-auto pt-6">
                        <button type="submit" className="w-full bg-[#4a4a4a] text-white font-medium py-3 rounded-lg hover:bg-[#333333] transition-colors shadow-sm active:scale-[0.98] tracking-widest">
                          新增至資料庫
                        </button>
                      </div>
                    </div>

                  </form>
                </div>

                <div>
                  <h2 className="text-lg font-semibold mb-4 text-stone-700 tracking-wide">所有建檔資料 ({boxes.length})</h2>
                  <div className="bg-white rounded-2xl shadow-sm border border-stone-100 overflow-hidden">
                    <div className="hidden md:block overflow-x-auto">
                      <table className="w-full text-left border-collapse min-w-[500px]">
                        <thead>
                          <tr className="bg-[#f7f5f0] border-b border-stone-200 text-xs text-stone-500 uppercase tracking-wider">
                            <th className="p-4 font-medium w-20">縮圖</th>
                            <th className="p-4 font-medium">品名 / 品牌</th>
                            <th className="p-4 font-medium w-24 text-center">種類</th>
                            <th className="p-4 font-medium text-center">寬 × 深 × 高 (cm)</th>
                            <th className="p-4 font-medium text-center">金額 / 連結</th>
                            <th className="p-4 font-medium text-center w-28">操作</th>
                          </tr>
                        </thead>
                        <tbody className="divide-y divide-stone-100">
                          {boxes.map(box => {
                            const catInfo = getCategoryDisplay(box.category);
                            return (
                              <tr key={box.id} className="hover:bg-stone-50 transition-colors group">
                                <td className="p-4">
                                  <div className="w-12 h-12 rounded-lg overflow-hidden bg-stone-100 border border-stone-200">
                                    <img src={box.image} alt={box.name} className="w-full h-full object-cover" />
                                  </div>
                                </td>
                                <td className="p-4">
                                  <div className="font-medium text-stone-800">{box.name}</div>
                                  <div className="text-xs text-stone-400 mt-1">{box.brand || '無品牌'}</div>
                                </td>
                                <td className="p-4 text-center">
                                  <span className={`inline-block text-xs px-2 py-1 rounded-md border ${catInfo.bgClass}`}>
                                    {catInfo.label}
                                  </span>
                                </td>
                                <td className="p-4 text-center">
                                  <div className="font-mono text-stone-600 bg-white border border-stone-200 inline-flex flex-col p-1.5 rounded-md text-sm shadow-sm min-w-[140px]">
                                    <div className="flex items-center justify-between gap-1">
                                      <span className="text-[10px] text-stone-700 w-4 text-left font-sans">外</span>
                                      <span className="flex-1 text-right">{box.w}</span>
                                      <span className="text-stone-300 text-[10px] w-2 text-center">×</span>
                                      <span className="flex-1 text-right">{box.l}</span>
                                      <span className="text-stone-300 text-[10px] w-2 text-center">×</span>
                                      <span className="flex-1 text-right">{box.h}</span>
                                    </div>
                                    {(box.iw || box.il || box.ih) && (
                                      <div className="flex items-center justify-between gap-1 mt-1 pt-1 border-t border-stone-100 text-stone-500">
                                        <span className="text-[10px] text-stone-400 w-4 text-left font-sans">內</span>
                                        <span className="flex-1 text-right">{box.iw || '-'}</span>
                                        <span className="text-stone-300 text-[10px] w-2 text-center">×</span>
                                        <span className="flex-1 text-right">{box.il || '-'}</span>
                                        <span className="text-stone-300 text-[10px] w-2 text-center">×</span>
                                        <span className="flex-1 text-right">{box.ih || '-'}</span>
                                      </div>
                                    )}
                                  </div>
                                </td>
                                <td className="p-4 text-center">
                                  {box.price && <div className="text-sm font-semibold text-stone-700 mb-1">NT$ {box.price}</div>}
                                  {box.url ? (
                                      <a href={box.url} target="_blank" rel="noreferrer" className="text-xs text-blue-500 hover:text-blue-700 underline inline-flex items-center">
                                          <i className="fas fa-link mr-1"></i> 連結
                                      </a>
                                  ) : (
                                      <span className="text-xs text-stone-300">-</span>
                                  )}
                                </td>
                                <td className="p-4 text-center">
                                  <div className="flex items-center justify-center space-x-1">
                                    <button onClick={() => setEditingBox({ ...box })} className="text-stone-400 hover:text-blue-500 p-2 rounded-full hover:bg-blue-50 transition-all focus:outline-none" title="編輯">
                                      <i className="fas fa-pencil-alt"></i>
                                    </button>
                                    <button onClick={() => handleDeleteBox(box.id)} className="text-stone-400 hover:text-red-500 p-2 rounded-full hover:bg-red-50 transition-all focus:outline-none" title="刪除">
                                      <i className="fas fa-trash"></i>
                                    </button>
                                  </div>
                                </td>
                              </tr>
                            )
                          })}
                          {boxes.length === 0 && (
                            <tr>
                              <td colSpan="6" className="p-12 text-center text-stone-400 bg-stone-50/30">
                                <i className="fas fa-box-open text-4xl mx-auto mb-3 opacity-20"></i>
                                <p className="tracking-wide">您的資料庫目前是空的</p>
                              </td>
                            </tr>
                          )}
                        </tbody>
                      </table>
                    </div>

                    <div className="md:hidden flex flex-col divide-y divide-stone-100">
                      {boxes.map(box => {
                        const catInfo = getCategoryDisplay(box.category);
                        return (
                          <div key={box.id} className="p-4 flex flex-col gap-3 hover:bg-stone-50 transition-colors">
                            <div className="flex gap-3 items-center">
                              <div className="w-16 h-16 rounded-lg overflow-hidden bg-stone-100 border border-stone-200 flex-shrink-0">
                                <img src={box.image} alt={box.name} className="w-full h-full object-cover" />
                              </div>
                              <div className="flex-1 min-w-0">
                                <div className="font-bold text-stone-800 text-sm truncate">{box.name}</div>
                                <div className="text-xs text-stone-400 mt-1">{box.brand || '無品牌'}</div>
                                <div className="mt-1.5 flex items-center justify-between">
                                  <span className={`inline-block text-[10px] px-2 py-0.5 rounded border ${catInfo.bgClass}`}>
                                    {catInfo.label}
                                  </span>
                                  <div className="text-right flex flex-col items-end gap-1 mt-1">
                                    <div className="font-mono text-stone-600 text-[11px] bg-stone-50 border border-stone-200 px-1.5 py-1 rounded inline-flex items-center justify-end min-w-[125px]">
                                      <span className="text-[9px] text-stone-400 w-3 text-left font-sans">外</span>
                                      <span className="flex-1 text-right">{box.w}</span>
                                      <span className="text-stone-300 text-[9px] w-3 text-center">×</span>
                                      <span className="flex-1 text-right">{box.l}</span>
                                      <span className="text-stone-300 text-[9px] w-3 text-center">×</span>
                                      <span className="flex-1 text-right">{box.h}</span>
                                    </div>
                                    {(box.iw || box.il || box.ih) && (
                                      <div className="font-mono text-stone-500 text-[11px] bg-white border border-stone-100 px-1.5 py-1 rounded inline-flex items-center justify-end min-w-[125px]">
                                        <span className="text-[9px] text-stone-300 w-3 text-left font-sans">內</span>
                                        <span className="flex-1 text-right">{box.iw || '-'}</span>
                                        <span className="text-stone-300 text-[9px] w-3 text-center">×</span>
                                        <span className="flex-1 text-right">{box.il || '-'}</span>
                                        <span className="text-stone-300 text-[9px] w-3 text-center">×</span>
                                        <span className="flex-1 text-right">{box.ih || '-'}</span>
                                      </div>
                                    )}
                                  </div>
                                </div>
                              </div>
                            </div>
                            <div className="flex justify-between items-center mt-1">
                              <div>
                                {box.price ? <div className="text-sm font-semibold text-stone-700">NT$ {box.price}</div> : <div className="text-sm text-transparent">-</div>}
                                {box.url && (
                                    <a href={box.url} target="_blank" rel="noreferrer" className="text-xs text-blue-500 hover:text-blue-700 underline inline-flex items-center mt-0.5">
                                        <i className="fas fa-link mr-1"></i> 連結
                                    </a>
                                )}
                              </div>
                              <div className="flex items-center space-x-2">
                                <button onClick={() => setEditingBox({ ...box })} className="text-stone-400 hover:text-blue-500 w-8 h-8 flex items-center justify-center rounded-full hover:bg-blue-50 transition-all border border-transparent hover:border-blue-100 focus:outline-none" title="編輯">
                                  <i className="fas fa-pencil-alt text-sm"></i>
                                </button>
                                <button onClick={() => handleDeleteBox(box.id)} className="text-stone-400 hover:text-red-500 w-8 h-8 flex items-center justify-center rounded-full hover:bg-red-50 transition-all border border-transparent hover:border-red-100 focus:outline-none" title="刪除">
                                  <i className="fas fa-trash text-sm"></i>
                                </button>
                              </div>
                            </div>
                          </div>
                        );
                      })}
                      {boxes.length === 0 && (
                        <div className="p-12 text-center text-stone-400 bg-stone-50/30">
                          <i className="fas fa-box-open text-4xl mx-auto mb-3 opacity-20"></i>
                          <p className="tracking-wide text-sm">您的資料庫目前是空的</p>
                        </div>
                      )}
                    </div>
                  </div>
                </div>
              </div>
            )}
            </div>

            <aside className="w-full lg:w-80 flex-shrink-0 animate-[fadeIn_0.5s_ease-out]">
              <div className="bg-white rounded-2xl shadow-sm border border-stone-100 sticky top-24 overflow-hidden flex flex-col max-h-[calc(100vh-8rem)]">
                <div className="p-5 border-b border-stone-100 bg-stone-50 flex justify-between items-center">
                  <h2 className="text-lg font-bold text-stone-700 flex items-center">
                    <i className="fas fa-shopping-cart text-stone-400 mr-2"></i> 採購清單
                  </h2>
                  <span className="bg-stone-200 text-stone-600 text-xs font-bold px-2 py-1 rounded-full">{cart.length}</span>
                </div>
                
                <div className="flex-1 overflow-y-auto p-4 space-y-2 min-h-[200px] bg-white">
                  {cart.length === 0 ? (
                    <div className="flex flex-col items-center justify-center h-full text-stone-400 py-10">
                      <i className="fas fa-cart-arrow-down text-4xl mb-3 opacity-30"></i>
                      <p className="text-sm tracking-wide">清單目前是空的</p>
                    </div>
                  ) : (
                    cart.map(item => (
                      <div key={item.id} className="flex gap-3 bg-stone-50 p-3 rounded-xl border border-stone-100 relative group transition-all">
                        <img src={item.image} alt={item.name} className="w-16 h-16 object-cover rounded-lg bg-stone-200 border border-stone-200 flex-shrink-0" />
                        <div className="flex-1 flex flex-col justify-between min-w-0">
                          <div className="pr-5">
                            <h4 className="text-sm font-bold text-stone-800 leading-tight truncate">{item.name}</h4>
                            <div className="text-xs text-stone-500 mt-1">NT$ {item.price || 0}</div>
                          </div>
                          <div className="flex items-center justify-between mt-2">
                            <div className="flex items-center space-x-1 bg-white rounded-md border border-stone-200 px-1 shadow-sm flex-shrink-0">
                              <button onClick={() => updateCartItemQuantity(item.id, -1)} className="w-6 h-6 flex items-center justify-center text-stone-500 hover:text-stone-800 transition-colors focus:outline-none">
                                <i className="fas fa-minus text-[10px]"></i>
                              </button>
                              <span className="w-5 text-center font-mono text-xs font-medium">{item.quantity}</span>
                              <button onClick={() => updateCartItemQuantity(item.id, 1)} className="w-6 h-6 flex items-center justify-center text-stone-500 hover:text-stone-800 transition-colors focus:outline-none">
                                <i className="fas fa-plus text-[10px]"></i>
                              </button>
                            </div>
                            <div className="font-bold text-sm text-stone-700">NT$ {(item.price || 0) * item.quantity}</div>
                          </div>
                        </div>
                        <button onClick={() => removeFromCart(item.id)} className="absolute top-2 right-2 text-stone-300 hover:text-red-500 p-1 opacity-0 group-hover:opacity-100 transition-opacity focus:outline-none bg-white rounded-full shadow-sm" title="移除">
                          <i className="fas fa-times text-sm"></i>
                        </button>
                      </div>
                    ))
                  )}
                </div>

                <div className="p-5 border-t border-stone-100 bg-stone-50">
                  <div className="flex justify-between items-center mb-4">
                    <span className="text-stone-500 font-medium text-sm">預估總金額</span>
                    <span className="text-xl font-bold text-stone-800">NT$ {cartTotal.toLocaleString()}</span>
                  </div>
                  <button 
                    onClick={generatePDF}
                    className="w-full bg-stone-800 text-white font-medium py-2.5 rounded-lg hover:bg-stone-900 transition-colors shadow-sm disabled:opacity-50 disabled:cursor-not-allowed flex items-center justify-center" 
                    disabled={cart.length === 0 || isGeneratingPDF}
                  >
                    {isGeneratingPDF ? (
                      <><i className="fas fa-spinner fa-spin mr-2"></i> 正在產生 PDF...</>
                    ) : (
                      <><i className="fas fa-file-pdf mr-2"></i> 輸出收納品採購清單 PDF</>
                    )}
                  </button>
                </div>
              </div>
            </aside>

          </main>

          <div id="pdf-export-container" className="absolute pointer-events-none -z-50" style={{ left: '-10000px', top: '0px', width: '800px' }}>
            <div ref={pdfRef} className="bg-white text-stone-800 font-sans box-border mx-auto" style={{ width: '800px', padding: '40px' }}>
              
              <div className="text-center border-b-2 border-stone-800 pb-6 mb-6">
                <h1 className="text-4xl font-bold tracking-widest text-stone-800 mb-2">收納品採購清單</h1>
                <h2 className="text-1xl text-stone-500 font-medium tracking-widest">製表人－整理師Jenny</h2>
              </div>
              
              <div className="flex justify-between mb-2 text-stone-600 font-medium">
                <div>製表日期：{new Date().toLocaleDateString('zh-TW')}</div>
                </div>

              <table className="w-full text-left border-collapse mb-8 table-fixed" style={{ tableLayout: 'fixed' }}>
                <thead>
                  <tr className="bg-stone-100 text-stone-700 border-b-2 border-stone-300">
                    <th className="py-3 px-2 font-bold text-center" style={{ width: '8%' }}>項次</th>
                    <th className="py-3 px-2 font-bold" style={{ width: '38%' }}>品項名稱/品牌</th>
                    <th className="py-3 px-2 font-bold text-center" style={{ width: '22%' }}>尺寸 (W×D×H)</th>
                    <th className="py-3 px-2 font-bold text-center" style={{ width: '12%' }}>單價</th>
                    <th className="py-3 px-2 font-bold text-center" style={{ width: '8%' }}>數量</th>
                    <th className="py-3 px-2 font-bold text-right" style={{ width: '12%' }}>小計</th>
                  </tr>
                </thead>
                <tbody className="divide-y divide-stone-200">
                  {cart.map((item, index) => (
                    <tr key={item.id} className="text-stone-700">
                      <td className="py-3 px-2 text-center">{index + 1}</td>
                      <td className="py-3 px-2 pr-4 break-words">
                        <div className="font-bold text-sm leading-snug">{item.name}</div>
                        <div className="text-xs text-stone-500 mt-1">{item.brand || '無品牌'}</div>
                      </td>
                      <td className="py-3 px-2 text-center text-sm text-stone-500">
                        {item.w} × {item.l} × {item.h}
                      </td>
                      <td className="py-3 px-2 text-right">NT$ {(item.price || 0).toLocaleString()}</td>
                      <td className="py-3 px-2 text-center">{item.quantity}</td>
                      <td className="py-3 px-2 text-right font-medium">NT$ {((item.price || 0) * item.quantity).toLocaleString()}</td>
                    </tr>
                  ))}
                </tbody>
              </table>

              <div className="border-t-2 border-stone-800 pt-6 flex justify-end">
                <div className="text-right">
                  <div className="text-stone-500 font-medium mb-1 tracking-widest">TOTAL AMOUNT</div>
                  <div className="text-3xl font-bold text-stone-800">
                    總計：NT$ {cartTotal.toLocaleString()}
                  </div>
                </div>
              </div>

              <div className="mt-16 pt-8 border-t border-stone-200 text-center text-sm text-stone-400">
                <p>本清單由系統自動生成</p>
                <p className="mt-1">※ 商品價格與庫存狀況依實際購買通路為準 ※</p>
              </div>
            </div>
          </div>

        </div>
      );
    }

    function AppWrapper() {
      const [firebaseReady, setFirebaseReady] = useState(false);
      
      useEffect(() => {
        if (window.firebaseAPI) {
          setFirebaseReady(true);
        } else {
          const handleLoad = () => setFirebaseReady(true);
          window.addEventListener('firebase-loaded', handleLoad);
          return () => window.removeEventListener('firebase-loaded', handleLoad);
        }
      }, []);

      if (!firebaseReady) {
        return <div className="min-h-screen bg-[#f7f5f0] flex items-center justify-center text-stone-400">正在準備系統環境...</div>;
      }
      return <MainApp />;
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<AppWrapper />);
  </script>
  
  <style>
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</body>
</html>
