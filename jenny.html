<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>O-Space 收納資料庫</title>
  
  <!-- 載入 Tailwind CSS (用於快速排版與設計) -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- 載入 Font Awesome 圖示 (替換原本的 Lucide 圖示) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- 載入 React 核心庫 -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  
  <!-- 載入 Babel (讓瀏覽器能即時解析 React 的 JSX 語法) -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-[#f7f5f0]">
  
  <div id="root"></div>

  <!-- 使用 ES Modules 載入 Firebase (適用於現代瀏覽器與純 HTML) -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
    import { getFirestore, collection, addDoc, deleteDoc, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    // 為了讓下方的 Babel/React 腳本能使用這些 Firebase 功能，我們將它們綁定到 window 物件上
    window.firebaseAPI = {
      initializeApp, getAuth, signInAnonymously, onAuthStateChanged,
      getFirestore, collection, addDoc, deleteDoc, doc, onSnapshot
    };

    // 發送一個自訂事件，通知 React 說「Firebase 準備好了」
    window.dispatchEvent(new Event('firebase-loaded'));
  </script>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    // 如果 Firebase 未設定或連線失敗時，使用的預設假資料
    const defaultBoxes = [
      { name: "無印良品 聚丙烯收納盒 (大)", brand: "MUJI", l: 26, w: 37, h: 24, image: "https://images.unsplash.com/photo-1595422652236-419b67b14db8?auto=format&fit=crop&w=300&q=80" },
      { name: "IKEA KUGGIS 附蓋收納盒", brand: "IKEA", l: 26, w: 35, h: 15, image: "https://images.unsplash.com/photo-1611269154421-4e27233ac5c7?auto=format&fit=crop&w=300&q=80" }
    ];

    function MainApp() {
      // ?????? 重要：請在此處貼上您從 Firebase 控制台取得的設定 ??????
      // 請將這整個物件替換為您的設定碼
      const firebaseConfig = {
         apiKey: "AIzaSyDroMVHoUROFhn0LwclRbb5OpHLGSzsu9A",
         authDomain: "jenny-space.firebaseapp.com",
         projectId: "jenny-space",
         storageBucket: "jenny-space.firebasestorage.app",
         messagingSenderId: "948251254988",
        appId: "1:948251254988:web:6354bacee423d2856f2269"
      };

      // 定義這個應用的儲存路徑前綴
      const appId = 'ospace-v1';

      // --- 狀態管理 ---
      const [activeTab, setActiveTab] = useState('search');
      const [boxes, setBoxes] = useState([]);
      const [user, setUser] = useState(null);
      const [isLoading, setIsLoading] = useState(true);
      const [isCloudSyncing, setIsCloudSyncing] = useState(false);
      const [modalMessage, setModalMessage] = useState(null);
      
      const [searchParams, setSearchParams] = useState({ l: '', w: '', h: '' });
      const [newBox, setNewBox] = useState({ name: '', brand: '', l: '', w: '', h: '', image: '' });
      const [previewImage, setPreviewImage] = useState(null);
      const fileInputRef = useRef(null);

      const fb = useMemo(() => {
        // 檢查使用者是否已經填寫了設定檔 (藉由檢查 apiKey 是否存在)
        if (firebaseConfig && firebaseConfig.apiKey && firebaseConfig.apiKey !== "AIzaSyXXXXXXXXXXXXXXX") {
            try {
              const app = window.firebaseAPI.initializeApp(firebaseConfig);
              return {
                  app,
                  auth: window.firebaseAPI.getAuth(app),
                  db: window.firebaseAPI.getFirestore(app)
              };
            } catch (e) {
              console.error("Firebase 初始化失敗，請檢查設定：", e);
              return null;
            }
        }
        return null;
      }, []);

      // 處理匿名登入
      useEffect(() => {
        if (!fb) {
          // 如果沒有 Firebase 設定，自動降級為顯示本地範例資料
          setBoxes(defaultBoxes.map((box, index) => ({ ...box, id: `local-${index}` })));
          setIsLoading(false);
          return;
        }

        const initAuth = async () => {
          try {
            await window.firebaseAPI.signInAnonymously(fb.auth);
          } catch (error) {
            console.error("登入失敗:", error);
            showMessage("連線至雲端失敗，請重新整理頁面");
            setIsLoading(false);
          }
        };

        initAuth();

        // 監聽登入狀態改變
        const unsubscribeAuth = window.firebaseAPI.onAuthStateChanged(fb.auth, (currentUser) => {
          setUser(currentUser);
          if (!currentUser) setIsLoading(false);
        });

        return () => unsubscribeAuth();
      }, [fb]);

      // 監聽使用者的專屬資料庫 (Firestore)
      useEffect(() => {
        if (!user || !fb || !fb.db) return;

        setIsLoading(true);
        // 設定資料庫路徑：每個使用者有自己獨立的資料夾 (依賴匿名登入的 UID)
        const boxesRef = window.firebaseAPI.collection(fb.db, 'users', user.uid, 'boxes');
        
        const unsubscribeSnapshot = window.firebaseAPI.onSnapshot(boxesRef, (snapshot) => {
          const loadedBoxes = [];
          snapshot.forEach((doc) => {
            loadedBoxes.push({ id: doc.id, ...doc.data() });
          });
          
          // 依照建立時間排序，新的在上面
          loadedBoxes.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
          
          setBoxes(loadedBoxes);
          setIsLoading(false);
          setIsCloudSyncing(true); // 標記雲端連線成功
        }, (error) => {
          console.error("讀取資料失敗:", error);
          showMessage("讀取雲端資料失敗，請確認 Firebase Rules 設定是否允許讀寫");
          setIsLoading(false);
          setIsCloudSyncing(false);
        });

        return () => unsubscribeSnapshot();
      }, [user, fb]);

      // 顯示自定義提示框
      const showMessage = (message) => {
        setModalMessage(message);
        setTimeout(() => setModalMessage(null), 3000);
      };

      const handleSearchChange = (e) => {
        const { name, value } = e.target;
        setSearchParams(prev => ({ ...prev, [name]: value }));
      };

      const handleNewBoxChange = (e) => {
        const { name, value } = e.target;
        setNewBox(prev => ({ ...prev, [name]: value }));
      };

      // 將上傳的圖片轉換為 Base64 字串，以便直接存入資料庫
      const handleImageUpload = (e) => {
        const file = e.target.files[0];
        if (file) {
          // 檢查檔案大小 (建議限制在 500KB 以下，避免 Firestore 文件過大)
          if(file.size > 500 * 1024) {
             showMessage("圖片檔案過大，請上傳小於 500KB 的圖片");
             return;
          }

          const reader = new FileReader();
          reader.onloadend = () => {
            setPreviewImage(reader.result);
            setNewBox(prev => ({ ...prev, image: reader.result }));
          };
          reader.readAsDataURL(file);
        }
      };

      // 新增收納盒
      const handleAddBox = async (e) => {
        e.preventDefault();
        if (!newBox.name || !newBox.l || !newBox.w || !newBox.h) {
          showMessage("請填寫必填欄位 (名稱、長、寬、高)");
          return;
        }
        
        const boxToAdd = {
          name: newBox.name,
          brand: newBox.brand || "",
          l: Number(newBox.l),
          w: Number(newBox.w),
          h: Number(newBox.h),
          // 如果沒有上傳圖片，給一張預設灰底圖
          image: newBox.image || "https://placehold.co/300x200/e2e8f0/64748b?text=No+Image",
          createdAt: Date.now()
        };

        if (user && fb && fb.db) {
          try {
            const boxesRef = window.firebaseAPI.collection(fb.db, 'users', user.uid, 'boxes');
            await window.firebaseAPI.addDoc(boxesRef, boxToAdd);
            showMessage("? 收納盒已成功加入雲端！");
          } catch (error) {
            console.error("新增失敗: ", error);
            showMessage("? 新增失敗，請確認您的資料庫權限設定");
          }
        } else {
          // 本地測試模式
          setBoxes([{ id: Date.now().toString(), ...boxToAdd }, ...boxes]);
          showMessage("收納盒已加入 (本地測試模式)");
        }

        // 清空表單
        setNewBox({ name: '', brand: '', l: '', w: '', h: '', image: '' });
        setPreviewImage(null);
        if (fileInputRef.current) fileInputRef.current.value = '';
      };

      // 刪除收納盒
      const handleDeleteBox = async (id) => {
        // 使用原生的 confirm 作為刪除確認 (為避免誤刪)
        if (!window.confirm("確定要刪除這個收納盒嗎？")) return;

        if (user && fb && fb.db) {
          try {
            await window.firebaseAPI.deleteDoc(window.firebaseAPI.doc(fb.db, 'users', user.uid, 'boxes', id));
            showMessage("??? 已刪除該收納盒");
          } catch (error) {
            console.error("刪除失敗: ", error);
            showMessage("刪除失敗");
          }
        } else {
          setBoxes(boxes.filter(box => box.id !== id));
          showMessage("已刪除 (本地測試模式)");
        }
      };

      const filteredBoxes = useMemo(() => {
        const spaceL = searchParams.l ? Number(searchParams.l) : Infinity;
        const spaceW = searchParams.w ? Number(searchParams.w) : Infinity;
        const spaceH = searchParams.h ? Number(searchParams.h) : Infinity;

        return boxes.map(box => {
          // 檢查正放是否可行
          const fitNormal = box.l <= spaceL && box.w <= spaceW && box.h <= spaceH;
          // 檢查轉向 90 度是否可行
          const fitRotated = box.w <= spaceL && box.l <= spaceW && box.h <= spaceH;
          return { ...box, fitNormal, fitRotated, isMatch: fitNormal || fitRotated };
        }).filter(box => {
          if (spaceL === Infinity && spaceW === Infinity && spaceH === Infinity) return true;
          return box.isMatch;
        });
      }, [boxes, searchParams]);

      if (isLoading) {
        return (
          <div className="min-h-screen flex flex-col items-center justify-center text-stone-500">
            <i className="fas fa-spinner fa-spin text-3xl mb-4 text-stone-400"></i>
            <p className="tracking-widest">正在載入您的專屬資料庫...</p>
          </div>
        );
      }

      return (
        <div className="min-h-screen text-stone-800 font-sans relative pb-20">
          
          {/* 全域提示訊息 Modal */}
          {modalMessage && (
            <div className="fixed top-20 left-1/2 transform -translate-x-1/2 z-50 animate-bounce">
              <div className="bg-stone-800 text-white px-6 py-3 rounded-full shadow-lg font-medium text-sm flex items-center tracking-wide">
                {modalMessage}
              </div>
            </div>
          )}

          {/* 頂部導覽列 */}
          <nav className="bg-white shadow-sm sticky top-0 z-10">
            <div className="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8">
              <div className="flex justify-between h-16">
                <div className="flex items-center">
                  <i className="fas fa-box w-6 h-6 text-stone-600 mr-2 text-xl mt-1"></i>
                  <span className="font-bold text-xl tracking-wider text-stone-700 hidden sm:inline">Jenny's 收納庫</span>
                  <span className="font-bold text-xl tracking-wider text-stone-700 sm:hidden">O-Space</span>
                  
                  <div className="ml-4 flex items-center mt-1" title={isCloudSyncing ? "資料已安全同步至雲端" : "目前為離線測試模式，資料無法保存"}>
                    {isCloudSyncing ? (
                      <i className="fas fa-cloud text-green-500 text-sm"></i>
                    ) : (
                      <i className="fas fa-cloud text-stone-300 opacity-50 text-sm"></i>
                    )}
                  </div>
                </div>
                <div className="flex items-center space-x-2 sm:space-x-4">
                  <button onClick={() => setActiveTab('search')} className={`px-3 py-2 rounded-md text-sm font-medium transition-colors flex items-center ${activeTab === 'search' ? 'bg-stone-100 text-stone-900' : 'text-stone-500 hover:text-stone-700'}`}>
                    <i className="fas fa-search sm:mr-2"></i> <span className="hidden sm:inline">找尺寸</span>
                  </button>
                  <button onClick={() => setActiveTab('manage')} className={`px-3 py-2 rounded-md text-sm font-medium transition-colors flex items-center ${activeTab === 'manage' ? 'bg-stone-100 text-stone-900' : 'text-stone-500 hover:text-stone-700'}`}>
                    <i className="fas fa-plus sm:mr-2"></i> <span className="hidden sm:inline">管理資料庫</span>
                  </button>
                </div>
              </div>
            </div>
          </nav>

          <main className="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
            
            {}
            {activeTab === 'search' && (
              <div className="space-y-8 animate-[fadeIn_0.5s_ease-out]">
                <div className="bg-white p-6 rounded-2xl shadow-sm border border-stone-100">
                  <h2 className="text-lg font-semibold mb-4 text-stone-700 flex items-center">
                    <i className="fas fa-ruler-combined w-5 h-5 mr-2 text-stone-400"></i> 輸入空間尺寸 (公分)
                  </h2>
                  <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <div>
                      <label className="block text-sm font-medium text-stone-500 mb-1">空間長度 (深度最深)</label>
                      <input type="number" name="l" value={searchParams.l} onChange={handleSearchChange} className="w-full px-4 py-2 bg-stone-50 border border-stone-200 rounded-lg focus:ring-2 focus:ring-stone-400 focus:outline-none" placeholder="例如: 40" />
                    </div>
                    <div>
                      <label className="block text-sm font-medium text-stone-500 mb-1">空間寬度 (面寬最大)</label>
                      <input type="number" name="w" value={searchParams.w} onChange={handleSearchChange} className="w-full px-4 py-2 bg-stone-50 border border-stone-200 rounded-lg focus:ring-2 focus:ring-stone-400 focus:outline-none" placeholder="例如: 30" />
                    </div>
                    <div>
                      <label className="block text-sm font-medium text-stone-500 mb-1">空間高度 (最高限制)</label>
                      <input type="number" name="h" value={searchParams.h} onChange={handleSearchChange} className="w-full px-4 py-2 bg-stone-50 border border-stone-200 rounded-lg focus:ring-2 focus:ring-stone-400 focus:outline-none" placeholder="例如: 25" />
                    </div>
                  </div>
                </div>

                <div>
                  <div className="mb-4 text-stone-600 font-medium tracking-wide">篩選結果：共 {filteredBoxes.length} 個合適的收納盒</div>
                  
                  {filteredBoxes.length === 0 ? (
                    <div className="text-center py-20 bg-white rounded-2xl border border-stone-100 border-dashed">
                      <i className="fas fa-box-open w-12 h-12 text-stone-200 mx-auto mb-3 text-5xl"></i>
                      <p className="text-stone-500 mt-4 tracking-wide">目前沒有符合該尺寸的收納盒</p>
                      <button onClick={() => setActiveTab('manage')} className="mt-4 text-stone-600 underline hover:text-stone-900 transition-colors">前往新增收納盒</button>
                    </div>
                  ) : (
                    <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
                      {filteredBoxes.map(box => (
                        <div key={box.id} className="bg-white rounded-2xl overflow-hidden shadow-sm hover:shadow-md transition-shadow border border-stone-100 group flex flex-col">
                          <div className="aspect-[4/3] bg-stone-50 relative overflow-hidden flex items-center justify-center">
                            <img src={box.image} alt={box.name} className="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500" />
                            <div className="absolute top-3 right-3 flex flex-col gap-2">
                              {box.fitNormal && (searchParams.l || searchParams.w || searchParams.h) && (
                                <span className="bg-green-100/90 backdrop-blur-sm text-green-700 text-xs px-2.5 py-1 rounded-full font-medium flex items-center shadow-sm">
                                  <i className="fas fa-check-circle mr-1.5"></i> 正放
                                </span>
                              )}
                              {!box.fitNormal && box.fitRotated && (searchParams.l || searchParams.w || searchParams.h) && (
                                <span className="bg-amber-100/90 backdrop-blur-sm text-amber-700 text-xs px-2.5 py-1 rounded-full font-medium flex items-center shadow-sm">
                                  <i className="fas fa-sync-alt mr-1.5"></i> 轉向
                                </span>
                              )}
                            </div>
                          </div>
                          <div className="p-5 flex-1 flex flex-col">
                            <div className="text-xs text-stone-400 mb-1.5 font-medium tracking-wider">{box.brand || '無品牌'}</div>
                            <h3 className="font-semibold text-stone-800 text-lg leading-tight mb-4 flex-1">{box.name}</h3>
                            <div className="flex justify-between items-center bg-[#f7f5f0] p-3 rounded-xl border border-stone-100">
                              <div className="text-center w-1/3">
                                <div className="text-[10px] text-stone-400 uppercase tracking-wider mb-0.5">長 L</div>
                                <div className="font-mono text-stone-700 font-medium">{box.l}</div>
                              </div>
                              <div className="text-stone-300 text-xs">×</div>
                              <div className="text-center w-1/3">
                                <div className="text-[10px] text-stone-400 uppercase tracking-wider mb-0.5">寬 W</div>
                                <div className="font-mono text-stone-700 font-medium">{box.w}</div>
                              </div>
                              <div className="text-stone-300 text-xs">×</div>
                              <div className="text-center w-1/3">
                                <div className="text-[10px] text-stone-400 uppercase tracking-wider mb-0.5">高 H</div>
                                <div className="font-mono text-stone-700 font-medium">{box.h}</div>
                              </div>
                            </div>
                          </div>
                        </div>
                      ))}
                    </div>
                  )}
                </div>
              </div>
            )}

            {}
            {activeTab === 'manage' && (
              <div className="space-y-8 animate-[fadeIn_0.5s_ease-out]">
                <div className="bg-white p-6 rounded-2xl shadow-sm border border-stone-100">
                  <h2 className="text-lg font-semibold mb-6 text-stone-700 flex items-center">
                    <i className="fas fa-plus-circle w-5 h-5 mr-2 text-stone-400"></i> 新增收納盒
                  </h2>
                  <form onSubmit={handleAddBox} className="grid grid-cols-1 md:grid-cols-2 gap-8">
                    <div>
                      <label className="block text-sm font-medium text-stone-500 mb-2">上傳圖片 (選填)</label>
                      <div className="border-2 border-dashed border-stone-200 rounded-2xl bg-stone-50 hover:bg-stone-100 transition-colors flex flex-col items-center justify-center cursor-pointer relative overflow-hidden aspect-video" onClick={() => fileInputRef.current?.click()}>
                        {previewImage ? (
                          <img src={previewImage} alt="Preview" className="w-full h-full object-cover" />
                        ) : (
                          <div className="flex flex-col items-center text-stone-400 p-4 text-center">
                            <i className="fas fa-camera text-3xl mb-3 opacity-40"></i>
                            <span className="text-sm font-medium tracking-wide">點擊上傳商品照</span>
                            <span className="text-xs mt-2 opacity-60">建議容量小於 500KB</span>
                          </div>
                        )}
                        <input type="file" accept="image/jpeg, image/png, image/webp" className="hidden" ref={fileInputRef} onChange={handleImageUpload} />
                      </div>
                    </div>
                    <div className="space-y-4">
                      <div>
                        <label className="block text-sm font-medium text-stone-500 mb-1">產品名稱 <span className="text-red-400">*</span></label>
                        <input required type="text" name="name" value={newBox.name} onChange={handleNewBoxChange} className="w-full px-4 py-2 bg-stone-50 border border-stone-200 rounded-lg focus:ring-2 focus:ring-stone-400 focus:outline-none transition-shadow" placeholder="例如：聚丙烯檔案盒" />
                      </div>
                      <div>
                        <label className="block text-sm font-medium text-stone-500 mb-1">品牌</label>
                        <input type="text" name="brand" value={newBox.brand} onChange={handleNewBoxChange} className="w-full px-4 py-2 bg-stone-50 border border-stone-200 rounded-lg focus:ring-2 focus:ring-stone-400 focus:outline-none transition-shadow" placeholder="例如：無印良品" />
                      </div>
                      <div className="grid grid-cols-3 gap-3">
                        <div>
                          <label className="block text-sm font-medium text-stone-500 mb-1">長 (cm) <span className="text-red-400">*</span></label>
                          <input required type="number" step="0.1" name="l" value={newBox.l} onChange={handleNewBoxChange} className="w-full px-3 py-2 bg-stone-50 border border-stone-200 rounded-lg focus:ring-2 focus:ring-stone-400 focus:outline-none font-mono" />
                        </div>
                        <div>
                          <label className="block text-sm font-medium text-stone-500 mb-1">寬 (cm) <span className="text-red-400">*</span></label>
                          <input required type="number" step="0.1" name="w" value={newBox.w} onChange={handleNewBoxChange} className="w-full px-3 py-2 bg-stone-50 border border-stone-200 rounded-lg focus:ring-2 focus:ring-stone-400 focus:outline-none font-mono" />
                        </div>
                        <div>
                          <label className="block text-sm font-medium text-stone-500 mb-1">高 (cm) <span className="text-red-400">*</span></label>
                          <input required type="number" step="0.1" name="h" value={newBox.h} onChange={handleNewBoxChange} className="w-full px-3 py-2 bg-stone-50 border border-stone-200 rounded-lg focus:ring-2 focus:ring-stone-400 focus:outline-none font-mono" />
                        </div>
                      </div>
                      <button type="submit" className="w-full mt-6 bg-[#4a4a4a] text-white font-medium py-3 rounded-lg hover:bg-[#333333] transition-colors shadow-sm active:scale-[0.98] tracking-widest">
                        新增至資料庫
                      </button>
                    </div>
                  </form>
                </div>

                <div>
                  <h2 className="text-lg font-semibold mb-4 text-stone-700 tracking-wide">所有建檔資料 ({boxes.length})</h2>
                  <div className="bg-white rounded-2xl shadow-sm border border-stone-100 overflow-hidden">
                    <div className="overflow-x-auto">
                      <table className="w-full text-left border-collapse min-w-[500px]">
                        <thead>
                          <tr className="bg-[#f7f5f0] border-b border-stone-200 text-xs text-stone-500 uppercase tracking-wider">
                            <th className="p-4 font-medium w-20">縮圖</th>
                            <th className="p-4 font-medium">品名 / 品牌</th>
                            <th className="p-4 font-medium text-center">長 × 寬 × 高 (cm)</th>
                            <th className="p-4 font-medium text-center w-24">操作</th>
                          </tr>
                        </thead>
                        <tbody className="divide-y divide-stone-100">
                          {boxes.map(box => (
                            <tr key={box.id} className="hover:bg-stone-50 transition-colors group">
                              <td className="p-4">
                                <div className="w-12 h-12 rounded-lg overflow-hidden bg-stone-100 border border-stone-200">
                                  <img src={box.image} alt={box.name} className="w-full h-full object-cover" />
                                </div>
                              </td>
                              <td className="p-4">
                                <div className="font-medium text-stone-800">{box.name}</div>
                                <div className="text-xs text-stone-400 mt-1">{box.brand || '無品牌'}</div>
                              </td>
                              <td className="p-4 text-center">
                                <div className="font-mono text-stone-600 bg-white border border-stone-200 inline-block px-3 py-1.5 rounded-md text-sm shadow-sm">
                                  {box.l} × {box.w} × {box.h}
                                </div>
                              </td>
                              <td className="p-4 text-center">
                                <button onClick={() => handleDeleteBox(box.id)} className="text-stone-300 hover:text-red-500 p-2 rounded-full hover:bg-red-50 transition-all focus:outline-none" title="刪除">
                                  <i className="fas fa-trash"></i>
                                </button>
                              </td>
                            </tr>
                          ))}
                          {boxes.length === 0 && (
                            <tr>
                              <td colSpan="4" className="p-12 text-center text-stone-400 bg-stone-50/30">
                                <i className="fas fa-box-open text-4xl mx-auto mb-3 opacity-20"></i>
                                <p className="tracking-wide">您的資料庫目前是空的</p>
                              </td>
                            </tr>
                          )}
                        </tbody>
                      </table>
                    </div>
                  </div>
                </div>
              </div>
            )}
          </main>
        </div>
      );
    }

    function AppWrapper() {
      const [firebaseReady, setFirebaseReady] = useState(false);
      
      useEffect(() => {
        // 檢查 firebaseAPI 是否已經被我們上面的 module script 掛載到 window
        if (window.firebaseAPI) {
          setFirebaseReady(true);
        } else {
          // 如果還沒，就監聽自訂事件
          const handleLoad = () => setFirebaseReady(true);
          window.addEventListener('firebase-loaded', handleLoad);
          return () => window.removeEventListener('firebase-loaded', handleLoad);
        }
      }, []);

      if (!firebaseReady) {
        return <div className="min-h-screen bg-[#f7f5f0] flex items-center justify-center text-stone-400">正在準備系統環境...</div>;
      }
      return <MainApp />;
    }

    // 將 React 應用掛載到 DOM
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<AppWrapper />);
  </script>
  
  <style>
    /* 自訂簡單的漸入動畫 */
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</body>
</html>
